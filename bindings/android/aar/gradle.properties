org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.daemon=false
android.useAndroidX=false
android.nonTransitiveRClass=true
# SDK platform android-37.0 installs under a ".0"-suffixed dir; AGP also
# accepts hash "android-37" (symlinked above). Silence the "unsupported
# compileSdk" advisory for AGP builds on this newer platform.
android.suppressUnsupportedCompileSdk=37