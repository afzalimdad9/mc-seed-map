name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: linux · core suite (native · wasm · web · CLI · all bindings)
    runs-on: ubuntu-latest
    env:
      EMCC: /opt/emsdk/upstream/emscripten/emcc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Emscripten SDK (pinned)
        run: |
          git clone --depth 1 --branch 3.1.74 https://github.com/emscripten-core/emsdk.git /opt/emsdk
          /opt/emsdk/emsdk install 3.1.74
          /opt/emsdk/emsdk activate 3.1.74

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Kotlin compiler (host JNI test)
        run: |
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.1.20/kotlin-compiler-2.1.20.zip
          mkdir -p "$HOME/.local/share"
          unzip -q -o -d "$HOME/.local/share" /tmp/kotlin.zip
          echo "KOTLINC=$HOME/.local/share/kotlinc/bin/kotlinc" >> "$GITHUB_ENV"

      - name: Install Playwright Chromium
        run: npm ci && npx playwright install --with-deps chromium

      - name: Full core suite
        run: |
          set -euo pipefail
          npm run build:native && npm run test:native
          npm run build:wasm && npm run test:wasm && npm run test:wasm-pack
          npm run test:finder && npm run test:structures && npm run test:versions
          npm run test:golden && npm run test:golden-regen
          npm run test:browser && npm run test:interface
          npm run test:android
          npm run test:csharp && npm run test:python
        # Swift + XCFramework run on the macOS job; Android SDK/AAR on the
        # android job; the on-device emulator test is the manual "ports" job.

  macos:
    name: macos · native · wasm · swift · apple XCFramework
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Emscripten SDK (pinned) into \$HOME
        run: |
          git clone --depth 1 --branch 3.1.74 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install 3.1.74
          "$HOME/emsdk/emsdk" activate 3.1.74
        # /opt is not writable on macOS runners; build-wasm.mjs auto-detects
        # $HOME/emsdk/upstream/emscripten/emcc, so no EMCC override needed.

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Playwright Chromium
        run: npm ci && npx playwright install chromium

      - name: macOS suite (Swift runs on its native toolchain)
        run: |
          set -euo pipefail
          npm run build:native && npm run test:native
          npm run build:wasm && npm run test:wasm && npm run test:wasm-pack
          npm run test:finder && npm run test:structures && npm run test:versions
          npm run test:golden && npm run test:golden-regen
          npm run test:browser && npm run test:interface
          npm run test:swift && npm run test:csharp && npm run test:python

      - name: Build Apple XCFramework and validate slices
        run: |
          bash bindings/apple/xcframework.sh
          FRM=bindings/apple/seed_engine.xcframework
          LIBS=( $(find "$FRM" -name '*.a') )
          echo "platform libs: ${#LIBS[@]}"
          total=0
          for a in "${LIBS[@]}"; do
            archs="$(xcrun lipo -archs "$a")"
            echo "  ${a#$FRM/}: $archs"
            total=$((total + $(echo $archs | wc -w)))
          done
          echo "arch slices: $total"
          test "${#LIBS[@]}" -eq 3
          test "$total" -eq 5
          ls "$FRM"

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@v4
        with:
          name: seed_engine.xcframework
          path: bindings/apple/seed_engine.xcframework
          if-no-files-found: error

  windows:
    name: windows · native (MinGW gcc) · C# · Python
    runs-on: windows-latest
    env:
      CMAKE_GENERATOR: Ninja
      CC: gcc
      PYTHON: python
    steps:
      - uses: actions/checkout@v4

      # MSYS2 provides gcc + ninja; its action becomes the default shell for
      # run steps (which is how we get bash + gcc + make on Windows).
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-ninja

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Windows suite
        run: |
          set -euo pipefail
          npm ci
          npm run build:native
          ./build/native/native_smoke.exe
          mkdir -p /tmp/opencode
          ./build/native/golden_dump.exe /tmp/opencode/worlds.regen.bin
          cmp tests/golden/worlds.bin /tmp/opencode/worlds.regen.bin
          bash bindings/csharp/run.sh
          bash bindings/python/run.sh
        # WASM is exercised on linux + macOS; the emcc launcher on Windows is
        # a .bat/.py wrapper that the build script cannot execFileSync portably.
        # The golden_dump+cmp above therefore checks the native engine's
        # byte-identical golden regression instead of the node/JS golden test.

  android:
    name: android · SDK · AAR build
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_USER_HOME: ${{ github.workspace }}/.android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK (cmdline-tools + API 37 + build-tools)
        run: |
          sudo mkdir -p "$ANDROID_HOME"
          curl -fsSL -o /tmp/cmdline.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          sudo unzip -q -o -d "$ANDROID_HOME/cmdline-tools" /tmp/cmdline.zip
          sudo mv -f "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.0" "build-tools;36.0.0" platform-tools >/dev/null
          sudo ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Android AAR build + integrity checks
        run: |
          npm run build:aar
          AAR=bindings/android/dist/aar/seedmaps-release.aar
          test -s "$AAR"
          unzip -l "$AAR" | grep -qE "classes.jar|lint.jar" && echo "AAR contains classes.jar"
          ls -l "$AAR"

  ports:
    name: ports · Android on-device (emulator, no KVM → slow, experimental)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    continue-on-error: true
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_USER_HOME: ${{ github.workspace }}/.android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK + system image
        run: |
          sudo mkdir -p "$ANDROID_HOME"
          curl -fsSL -o /tmp/cmdline.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          sudo unzip -q -o -d "$ANDROID_HOME/cmdline-tools" /tmp/cmdline.zip
          sudo mv -f "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          sudo "$SDKM" --install \
            "platforms;android-37.0" "build-tools;36.0.0" platform-tools emulator \
            "system-images;android-37;x86_64" >/dev/null
          sudo ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Boot emulator (software GPU; no KVM on hosted runners)
        run: |
          echo "no" | sudo "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n pixel -k "system-images;android-37;x86_64" --force >/dev/null
          "$ANDROID_HOME/emulator/emulator" -avd pixel \
            -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-accel &
          "$ANDROID_HOME/platform-tools/adb" wait-for-device
          for i in $(seq 1 60); do
            boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            [ "$boot" = "1" ] && break
            sleep 15
          done
          [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build + on-device test
        run: |
          npm ci
          npm run build:aar
          npm run test:android-device
        # On-device test scripts fudge JNI paths specific to the local emulator;
        # the CI emulator uses the same AVD shape, so this should be a superset.